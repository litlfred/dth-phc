<svg xmlns="http://www.w3.org/2000/svg" viewBox="56.94 55.67 480.57 298.84" width="961" height="598" font-family="'Source Sans Pro','Source Sans 3','Open Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Fig. 8. Example prompts and questions for starting broad and narrowing down">
<title>Fig. 8. Example prompts and questions for starting broad and narrowing down</title>
<g class="artwork"><path fill="#E6E7E8" fill-rule="nonzero" fill-opacity="1" d="M 56.871094 352.617188 L 536.859375 352.617188 L 536.859375 56.054688 L 56.871094 56.054688 Z M 56.871094 352.617188"/><path fill="none" stroke="#0099D6" stroke-width="6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-opacity="1" transform="matrix(0.998785,0,0,-0.998785,0,841.324)" d="M 59.693607 487.376703 L 535.584203 487.376703 L 535.584203 783.153972 L 59.693607 783.153972 Z M 59.693607 487.376703"/><path fill="#0099D6" fill-rule="nonzero" fill-opacity="1" d="M 153.988281 110.109375 L 315.945312 110.109375 L 330.238281 81.859375 L 139.695312 81.859375 Z M 153.988281 110.109375"/><path fill="#7EBC42" fill-rule="nonzero" fill-opacity="1" d="M 183.492188 168.433594 L 286.445312 168.433594 L 315.945312 110.113281 L 153.988281 110.113281 Z M 183.492188 168.433594"/><path fill="#F26829" fill-rule="nonzero" fill-opacity="1" d="M 207.890625 216.667969 L 262.042969 216.667969 L 286.441406 168.433594 L 183.492188 168.433594 Z M 207.890625 216.667969"/><path fill="#A7228B" fill-rule="nonzero" fill-opacity="1" d="M 262.042969 216.667969 L 207.890625 216.667969 L 234.964844 270.1875 Z M 262.042969 216.667969"/><path fill="none" stroke="#7EBC42" stroke-width="1.331" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="4" stroke-opacity="1" stroke-dasharray="0 3.944" transform="matrix(0.998785,0,0,-0.998785,104.625,116.881)" d="M -0.000250623 -0.00149913 L -0.000250623 -128.172822"/><path fill="none" stroke="#7EBC42" stroke-width="1.331" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="4" stroke-opacity="1" transform="matrix(0.998785,0,0,-0.998785,104.625,112.942)" d="M -0.000250623 0.000900826 L -0.000250623 0.000900826 M -0.000250623 -134.087767 L -0.000250623 -134.087767"/><path fill="none" stroke="#7EBC42" stroke-width="1.331" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-opacity="1" transform="matrix(0.998785,0,0,-0.998785,108.675,242.511)" d="M 0.000857359 -0.0012006 L -4.054851 -4.361967 L -8.110559 -0.0012006"/></g>
<g class="axis" data-part="broad"><text x="104.75" y="91.39" text-anchor="middle" font-size="9.32" font-weight="900" fill="#000000" textLength="30.28" lengthAdjust="spacingAndGlyphs" xml:space="preserve">BROAD</text><text x="104.75" y="102.02" text-anchor="middle" font-size="7.99" font-weight="400" fill="#000000" textLength="39.69" lengthAdjust="spacingAndGlyphs" xml:space="preserve">(Start here)</text></g>
<g class="axis" data-part="narrow"><text x="104.75" y="259.78" text-anchor="middle" font-size="9.32" font-weight="900" fill="#000000" textLength="38.73" lengthAdjust="spacingAndGlyphs" xml:space="preserve">NARROW</text><text x="104.75" y="270.41" text-anchor="middle" font-size="7.99" font-weight="400" fill="#000000" textLength="36.20" lengthAdjust="spacingAndGlyphs" xml:space="preserve">(End here)</text></g>
<g class="level" data-part="trust-bump"><text x="235.25" y="100.20" text-anchor="middle" font-size="9.32" font-weight="900" fill="#FFFFFF" textLength="56.43" lengthAdjust="spacingAndGlyphs" xml:space="preserve">TRUST BUMP</text></g>
<g class="level" data-part="birds-eye-view"><text x="235.25" y="141.37" text-anchor="middle" font-size="9.32" font-weight="900" fill="#FFFFFF" textLength="72.28" lengthAdjust="spacingAndGlyphs" xml:space="preserve">BIRD’S EYE VIEW</text></g>
<g class="level" data-part="magnifying-glass"><text x="235.25" y="189.61" text-anchor="middle" font-size="9.32" font-weight="900" fill="#FFFFFF" textLength="55.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">MAGNIFYING</text><text x="235.25" y="200.25" text-anchor="middle" font-size="9.32" font-weight="900" fill="#FFFFFF" textLength="27.56" lengthAdjust="spacingAndGlyphs" xml:space="preserve">GLASS</text></g>
<g class="level" data-part="microscope"><text x="235.25" y="229.27" text-anchor="middle" font-size="9.32" font-weight="900" fill="#FFFFFF" textLength="32.28" lengthAdjust="spacingAndGlyphs" xml:space="preserve">MICRO-</text><text x="235.25" y="239.91" text-anchor="middle" font-size="9.32" font-weight="900" fill="#FFFFFF" textLength="28.57" lengthAdjust="spacingAndGlyphs" xml:space="preserve">SCOPE</text></g>
<g class="prompt" data-part="trust-bump-prompt"><text x="340.98" y="89.59" font-size="10.65" font-weight="900" fill="#000000" textLength="112.54" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Intent &amp; Introductions</text><text x="340.98" y="102.88" font-size="10.65" font-weight="900" fill="#000000" textLength="173.06" lengthAdjust="spacingAndGlyphs" xml:space="preserve">“Tell me about your background…</text><text x="379.78" y="116.16" font-size="8.0" font-weight="900" fill="#0099D6" textLength="83.31" lengthAdjust="spacingAndGlyphs" xml:space="preserve">…as a health worker.”</text></g>
<g class="prompt" data-part="birds-eye-view-prompt"><text x="316.33" y="137.80" font-size="10.65" font-weight="900" fill="#000000" textLength="171.97" lengthAdjust="spacingAndGlyphs" xml:space="preserve">“Tell me about the last time you…</text><text x="335.57" y="150.31" font-size="8.0" font-weight="900" fill="#7EBC42" textLength="101.94" lengthAdjust="spacingAndGlyphs" xml:space="preserve">…registered a new client.”</text><text x="335.57" y="160.30" font-size="8.0" font-weight="900" fill="#7EBC42" textLength="104.63" lengthAdjust="spacingAndGlyphs" xml:space="preserve">…provided antenatal care.”</text><text x="335.57" y="170.29" font-size="8.0" font-weight="900" fill="#7EBC42" textLength="175.53" lengthAdjust="spacingAndGlyphs" xml:space="preserve">…provided a routine immunization to a child.”</text></g>
<g class="prompt" data-part="magnifying-glass-prompt-1"><text x="287.83" y="189.42" font-size="10.65" font-weight="900" fill="#000000" textLength="122.74" lengthAdjust="spacingAndGlyphs" xml:space="preserve">“Can you tell me more…</text><text x="352.00" y="202.72" font-size="8.0" font-weight="900" fill="#F26829" textLength="139.80" lengthAdjust="spacingAndGlyphs" xml:space="preserve">…about how you check for malaria?”</text></g>
<g class="prompt" data-part="magnifying-glass-prompt-2"><text x="287.83" y="216.01" font-size="10.65" font-weight="900" fill="#000000" textLength="148.22" lengthAdjust="spacingAndGlyphs" xml:space="preserve">“Can you show me how you…</text><text x="345.49" y="226.00" font-size="8.0" font-weight="900" fill="#F26829" textLength="146.31" lengthAdjust="spacingAndGlyphs" xml:space="preserve">…would fill out a paper register now?”</text></g>
<g class="prompt" data-part="microscope-prompt"><text x="265.79" y="236.83" font-size="10.65" font-weight="900" fill="#000000" textLength="42.91" lengthAdjust="spacingAndGlyphs" xml:space="preserve">5 Why’s</text><text x="265.79" y="250.13" font-size="10.65" font-weight="900" fill="#000000" textLength="74.56" lengthAdjust="spacingAndGlyphs" xml:space="preserve">“Why do you…</text><text x="304.75" y="260.12" font-size="8.0" font-weight="900" fill="#A7228B" textLength="210.87" lengthAdjust="spacingAndGlyphs" xml:space="preserve">…wait until the end of the day to fill out your records?”</text><text x="276.48" y="268.11" font-size="7.99" font-weight="400" fill="#000000" textLength="237.54" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Based on answer, continue to ask why until a root cause is revealed.</text></g>
<g class="prompt" data-part="closing"><text x="352.11" y="297.55" text-anchor="middle" font-size="10.65" font-weight="900" fill="#000000" textLength="212.99" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Express gratitude for health worker’s time</text></g>
