<g class="phase" data-part="deployment"><text x="352.18" y="259.60" font-size="11.0" font-weight="700" fill="#FFFFFF" textLength="59.51" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Deployment</text></g>
<g class="question" data-part="validation-q1"><text x="108.40" y="276.00" font-size="9.0" font-weight="400" fill="#000000" textLength="83.63" lengthAdjust="spacingAndGlyphs" xml:space="preserve">•  Do users need this?</text></g>
<g class="question" data-part="validation-q2"><text x="108.40" y="292.65" font-size="9.0" font-weight="400" fill="#000000" textLength="104.56" lengthAdjust="spacingAndGlyphs" xml:space="preserve">•  Would this digital record</text><text x="119.74" y="303.63" font-size="9.0" font-weight="400" fill="#000000" textLength="70.99" lengthAdjust="spacingAndGlyphs" xml:space="preserve">solve most of their</text><text x="119.74" y="314.62" font-size="9.0" font-weight="400" fill="#000000" textLength="92.98" lengthAdjust="spacingAndGlyphs" xml:space="preserve">administrative reporting</text><text x="119.74" y="325.61" font-size="9.0" font-weight="400" fill="#000000" textLength="39.60" lengthAdjust="spacingAndGlyphs" xml:space="preserve">problems?</text></g>
<g class="question" data-part="refinement-q1"><text x="230.29" y="276.00" font-size="9.0" font-weight="400" fill="#000000" textLength="102.21" lengthAdjust="spacingAndGlyphs" xml:space="preserve">•  Could this solution help</text><text x="241.63" y="286.98" font-size="9.0" font-weight="400" fill="#000000" textLength="95.12" lengthAdjust="spacingAndGlyphs" xml:space="preserve">improve service delivery?</text></g>
<g class="question" data-part="refinement-q2"><text x="230.29" y="303.63" font-size="9.0" font-weight="400" fill="#000000" textLength="102.21" lengthAdjust="spacingAndGlyphs" xml:space="preserve">•  Could this solution help</text><text x="241.63" y="314.62" font-size="9.0" font-weight="400" fill="#000000" textLength="90.19" lengthAdjust="spacingAndGlyphs" xml:space="preserve">improve accountability?</text></g>
<g class="question" data-part="refinement-q3"><text x="230.29" y="331.27" font-size="9.0" font-weight="400" fill="#000000" textLength="112.15" lengthAdjust="spacingAndGlyphs" xml:space="preserve">•  Will users use this solution</text><text x="241.63" y="342.25" font-size="9.0" font-weight="400" fill="#000000" textLength="99.73" lengthAdjust="spacingAndGlyphs" xml:space="preserve">as such? Or will they use it</text><text x="241.63" y="353.24" font-size="9.0" font-weight="400" fill="#000000" textLength="91.64" lengthAdjust="spacingAndGlyphs" xml:space="preserve">for some other purpose?</text></g>
<g class="question" data-part="deployment-q1"><text x="352.18" y="276.00" font-size="9.0" font-weight="400" fill="#000000" textLength="107.30" lengthAdjust="spacingAndGlyphs" xml:space="preserve">•  Does this have all the key</text><text x="363.52" y="286.98" font-size="9.0" font-weight="400" fill="#000000" textLength="81.97" lengthAdjust="spacingAndGlyphs" xml:space="preserve">features a user would</text><text x="363.52" y="297.97" font-size="9.0" font-weight="400" fill="#000000" textLength="22.46" lengthAdjust="spacingAndGlyphs" xml:space="preserve">want?</text></g>
<g class="question" data-part="deployment-q2"><text x="352.18" y="314.62" font-size="9.0" font-weight="400" fill="#000000" textLength="115.29" lengthAdjust="spacingAndGlyphs" xml:space="preserve">•  Will users be likely to adopt</text><text x="363.52" y="325.61" font-size="9.0" font-weight="400" fill="#000000" textLength="50.38" lengthAdjust="spacingAndGlyphs" xml:space="preserve">this solution?</text></g>
<g class="question" data-part="deployment-q3"><text x="352.18" y="342.25" font-size="9.0" font-weight="400" fill="#000000" textLength="101.68" lengthAdjust="spacingAndGlyphs" xml:space="preserve">•  What behaviour change</text><text x="363.52" y="353.24" font-size="9.0" font-weight="400" fill="#000000" textLength="85.25" lengthAdjust="spacingAndGlyphs" xml:space="preserve">will need to take place</text><text x="363.52" y="364.23" font-size="9.0" font-weight="400" fill="#000000" textLength="85.86" lengthAdjust="spacingAndGlyphs" xml:space="preserve">to adopt this solution?</text><text x="363.52" y="375.21" font-size="9.0" font-weight="400" fill="#000000" textLength="83.89" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Are there roadbloacks</text><text x="363.52" y="386.20" font-size="9.0" font-weight="400" fill="#000000" textLength="89.40" lengthAdjust="spacingAndGlyphs" xml:space="preserve">to adoption that can be</text><text x="363.52" y="397.19" font-size="9.0" font-weight="400" fill="#000000" textLength="100.06" lengthAdjust="spacingAndGlyphs" xml:space="preserve">addressed technologically</text><text x="363.52" y="408.17" font-size="9.0" font-weight="400" fill="#000000" textLength="100.07" lengthAdjust="spacingAndGlyphs" xml:space="preserve">or by changing the design?</text></g>
