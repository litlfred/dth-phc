<text x="307" y="368.0" font-size="15.5" fill="#1B2A55">Does the data element</text>
<text x="307" y="388.0" font-size="15.5" fill="#1B2A55">support the health worker</text>
<text x="307" y="408.0" font-size="15.5" fill="#1B2A55">during care provision or</text>
<text x="307" y="428.0" font-size="15.5" fill="#1B2A55">service delivery – is it</text>
<text x="307" y="448.0" font-size="15.5" fill="#1B2A55">needed for clinical</text>
<text x="307" y="468.0" font-size="15.5" fill="#1B2A55">decision-making, for</text>
<text x="307" y="488.0" font-size="15.5" fill="#1B2A55">example? Is the data</text>
<text x="307" y="508.0" font-size="15.5" fill="#1B2A55">element required for</text>
<text x="307" y="528.0" font-size="15.5" fill="#1B2A55">mandatory reporting or</text>
<text x="307" y="548.0" font-size="15.5" fill="#1B2A55">ensuring health worker</text>
<text x="307" y="568.0" font-size="15.5" fill="#1B2A55">accountability?</text>
<rect x="603" y="338" width="313" height="250" fill="#E6E0EE" stroke="#5B2C83" stroke-width="2"/>
<text x="619" y="398.0" font-size="15.5" fill="#5B2C83">Consider removing any data elements</text>
<text x="619" y="418.0" font-size="15.5" fill="#5B2C83">not needed for service delivery or</text>
<text x="619" y="438.0" font-size="15.5" fill="#5B2C83">accountability, to reduce the</text>
