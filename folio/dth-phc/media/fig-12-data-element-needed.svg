<text x="132.0" y="405.0" text-anchor="middle" font-size="21" fill="#FFFFFF" font-weight="700">2.</text>
<text x="132.0" y="431.0" text-anchor="middle" font-size="21" fill="#FFFFFF">Is the data</text>
