<text x="307" y="106.0" font-size="15.5" fill="#1B2A55">Duplicates could include</text>
<text x="307" y="126.0" font-size="15.5" fill="#1B2A55">data elements that have the</text>
<text x="307" y="146.0" font-size="15.5" fill="#1B2A55">same definition, but</text>
<text x="307" y="166.0" font-size="15.5" fill="#1B2A55">possibly with different</text>
<text x="307" y="186.0" font-size="15.5" fill="#1B2A55">labels. Some data elements</text>
<text x="307" y="206.0" font-size="15.5" fill="#1B2A55">(e.g. name, birthdate, age,</text>
<text x="307" y="226.0" font-size="15.5" fill="#1B2A55">unique identifier) might</text>
<text x="307" y="246.0" font-size="15.5" fill="#1B2A55">also be collected by</text>
<text x="307" y="266.0" font-size="15.5" fill="#1B2A55">multiple forms</text>
<rect x="603" y="76" width="313" height="210" fill="#E6E0EE" stroke="#5B2C83" stroke-width="2"/>
<text x="619" y="126.0" font-size="15.5" fill="#5B2C83">Reconcile any duplicated data</text>
<text x="619" y="146.0" font-size="15.5" fill="#5B2C83">elements into a single data</text>
<text x="619" y="166.0" font-size="15.5" fill="#5B2C83">element, that is collected once,</text>
<text x="619" y="186.0" font-size="15.5" fill="#5B2C83">with one data element label. (Use</text>
<text x="619" y="206.0" font-size="15.5" fill="#5B2C83">the description and definition of</text>
<text x="619" y="226.0" font-size="15.5" fill="#5B2C83">the data elements to determine</text>
<text x="619" y="246.0" font-size="15.5" fill="#5B2C83">which data elements to reconcile.)</text>
