<text x="132.0" y="149.0" text-anchor="middle" font-size="21" fill="#FFFFFF" font-weight="700">1.</text>
<text x="132.0" y="175.0" text-anchor="middle" font-size="21" fill="#FFFFFF">Is the data</text>
<text x="132.0" y="201.0" text-anchor="middle" font-size="21" fill="#FFFFFF">element</text>
