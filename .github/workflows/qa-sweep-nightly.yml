# QA sweep nightly: keeps this folio's QA verdicts current on qa-reports.
# Dispatch only.
#
# A thin caller: the steps are cat-harness-tools' reusable workflow, ONE
# copy for every harnessed repository (cat-harness-tools#1038), so this
# repository's CI cannot drift from smart-ra's or dth-hrh's again.
name: QA sweep nightly

on:
  workflow_dispatch:
    inputs:
      axes:
        description: "Comma-separated axes to sweep"
        required: false
        default: "canonical,one-voice,q-usage,compute,detangler"

permissions:
  contents: write

jobs:
  qa-sweep:
    uses: litlfred/cat-harness-tools/.github/workflows/folio-qa-sweep-nightly.yml@553cef51005027a509163e25be03622dd8dc77f4 # index.lock.json
    with:
      axes: ${{ inputs.axes }}
